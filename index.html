<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Dieta & Receitas Personalizadas</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
            margin: auto;
            background: #111115;
            color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h2 {
            text-align: center;
            color: #e5e7eb;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            color: #d1d5db;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background: #1f1f23;
            color: #fff;
            border: 1px solid #4b5563;
            border-radius: 6px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .macro-group {
            display: flex;
            gap: 10px;
        }
        .macro-group input {
            width: 32%;
        }
        button.btn-calcular {
            width: 100%;
            padding: 12px;
            background: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-calcular:hover {
            background: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            padding: 20px;
            background: #1a1a20;
            border-radius: 8px;
            border: 1px solid #333;
            display: none;
        }
        #resultado h3 {
            margin-top: 0;
            color: #60a5fa;
        }
        #resultado h4 {
            color: #34d399;
        }
        #resultado ul {
            padding-left: 20px;
        }
        #resultado li {
            margin-bottom: 6px;
        }
        button.btn-pdf {
            margin-top: 15px;
            padding: 10px 15px;
            background: #28a745;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-pdf:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🍎 Calculadora de Dieta &mdash; Receitas Personalizadas</h2>
    
    <div>
        <label for="sexo">Sexo:</label>
        <select id="sexo">
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
        </select>

        <label for="idade">Idade (anos):</label>
        <input id="idade" type="number" placeholder="Ex: 25" /> 

        <label for="peso">Peso (kg):</label>
        <input id="peso" type="number" step="0.1" placeholder="Ex: 70" /> 

        <label for="altura">Altura (cm):</label>
        <input id="altura" type="number" placeholder="Ex: 175" /> 

        <label for="atividade">Nível de atividade:</label>
        <select id="atividade">
            <option value="1.2">Sedentário (pouco ou nenhum exercício)</option>
            <option value="1.375">Leve (exercício leve 1-3 dias/semana)</option>
            <option value="1.55">Moderado (exercício moderado 3-5 dias/semana)</option>
            <option value="1.725">Ativo (exercício pesado 6-7 dias/semana)</option>
            <option value="1.9">Muito ativo (exercício muito pesado + trabalho físico)</option>
        </select>

        <label>Macronutrientes (%):</label>
        <div class="macro-group">
            <input id="carb" type="number" value="50" placeholder="Carboidratos %" /> 
            <input id="prot" type="number" value="30" placeholder="Proteínas %" /> 
            <input id="gord" type="number" value="20" placeholder="Gorduras %" />
        </div>

        <button class="btn-calcular" onclick="calcularDieta()">Calcular e Gerar Receita</button>
    </div>

    <div id="resultado">
        <h3>📊 Resultado</h3>
        <p id="resumo">&nbsp;</p>
        <h4>🍽️ Sugestão de Refeição com Quantidades</h4>
        <ul id="receita"></ul>
        <button class="btn-pdf" onclick="baixarPDF()">Baixar Dieta em PDF</button>
    </div>
</div>

<script>
function calcularDieta() {
    var sexo = document.getElementById("sexo").value;
    var idade = parseFloat(document.getElementById("idade").value);
    var peso = parseFloat(document.getElementById("peso").value);
    var altura = parseFloat(document.getElementById("altura").value);
    var atividade = parseFloat(document.getElementById("atividade").value);
    var carbP = parseFloat(document.getElementById("carb").value);
    var protP = parseFloat(document.getElementById("prot").value);
    var gordP = parseFloat(document.getElementById("gord").value);

    if (isNaN(peso) || isNaN(altura) || isNaN(idade)) {
        alert("Por favor, preencha todos os campos corretamente.");
        return;
    }

    // Fórmula de Harris-Benedict revisada
    var bmr = sexo == "masculino"
        ? 88.36 + (13.4 * peso) + (4.8 * altura) - (5.7 * idade)
        : 447.6 + (9.2 * peso) + (3.1 * altura) - (4.3 * idade);

    var tdee = bmr * atividade;

    var carbCal = (carbP / 100) * tdee;
    var protCal = (protP / 100) * tdee;
    var gordCal = (gordP / 100) * tdee;

    var carbG = carbCal / 4;
    var protG = protCal / 4;
    var gordG = gordCal / 9;

    document.getElementById("resultado").style.display = "block";
    document.getElementById("resumo").innerHTML =
        "BMR (Taxa Metabólica Basal): <b>" + Math.round(bmr) + " kcal</b><br>" +
        "TDEE (Gasto Energético Diário): <b>" + Math.round(tdee) + " kcal</b><br>" +
        "Carboidratos: <b>" + Math.round(carbG) + " g</b><br>" +
        "Proteínas: <b>" + Math.round(protG) + " g</b><br>" +
        "Gorduras: <b>" + Math.round(gordG) + " g</b>";

    var alimentos = [
        { nome: "Peito de frango grelhado", cal: 165, unidade: "g" },
        { nome: "Arroz integral cozido", cal: 124, unidade: "g" },
        { nome: "Feijão carioca cozido", cal: 76, unidade: "g" },
        { nome: "Brócolis cozido", cal: 35, unidade: "g" },
        { nome: "Azeite de oliva extra virgem", cal: 884, unidade: "ml" },
        { nome: "Banana prata", cal: 90, unidade: "g" },
        { nome: "Aveia em flocos", cal: 380, unidade: "g" },
        { nome: "Ovo cozido", cal: 155, unidade: "g" }
    ];

    var caloriasMeta = tdee * 0.6; // refeição principal ~60% do TDEE
    var lista = "";

    for (var i = 0; i < 5; i++) {
        var qtd = Math.round((caloriasMeta / 5) / alimentos[i].cal * 100) / 100;
        lista += "<li>" + alimentos[i].nome + ": <b>" + Math.round(qtd * 100) + " " + alimentos[i].unidade + "</b></li>";
    }

    document.getElementById("receita").innerHTML = lista;
}

function baixarPDF() {
    var conteudo = document.getElementById("resultado").innerText;
    var win = window.open("", "", "width=600,height=600");
    win.document.write("<html><head><title>Dieta - PDF</title></head><body><pre style='font-family: Arial, sans-serif; font-size: 16px;'>" + conteudo + "</pre></body></html>");
    win.document.close();
    win.print();
}
</script>

</body>
</html>
